# Nginx (host) — Corporación Destellos
# Subdominio HTTPS → PM2 (web :8085, api :3085)
#
# Uso típico:
#   sudo cp deploy/nginx-host-destellos.conf /etc/nginx/sites-available/corporaciondestellos
#   sudo ln -sf /etc/nginx/sites-available/corporaciondestellos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d corporaciondestellos.fersuastudio.com
#
# Ajusta HTTP_PORT / API_PORT si en .env.production usas otros.

server {
    listen 80;
    listen [::]:80;
    server_name corporaciondestellos.fersuastudio.com;

    client_max_body_size 10m;

    # API Nest (PM2 en API_PORT, default 3085)
    location /api/ {
        proxy_pass http://127.0.0.1:3085/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Front React (PM2 serve en HTTP_PORT, default 8085)
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
