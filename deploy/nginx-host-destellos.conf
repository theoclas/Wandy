# Nginx (host) — Corporación Destellos
# Subdominio HTTPS → PM2 (web :8085, api :3085)
#
# IMPORTANTE: si Certbot ya creó un archivo con SSL (p.ej.
# /etc/nginx/sites-available/corporaciondestellos.fersuastudio.com),
# debes poner el location /api/ DENTRO del server { listen 443 ssl; }.
# Tener solo el bloque en el server :80 no arregla el login por HTTPS.
#
# Uso:
#   Ver sitios: sudo ls /etc/nginx/sites-enabled/
#   Editar el de SSL y agregar location /api/ antes de location /
#   sudo nginx -t && sudo systemctl reload nginx

# HTTP → HTTPS (Certbot suele gestionar esto)
server {
    listen 80;
    listen [::]:80;
    server_name corporaciondestellos.fersuastudio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name corporaciondestellos.fersuastudio.com;

    # Certbot rellena estas rutas; no las inventes a mano si ya existen:
    # ssl_certificate /etc/letsencrypt/live/corporaciondestellos.fersuastudio.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/corporaciondestellos.fersuastudio.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10m;

    # Exacto /api (sin slash) → Nest
    location = /api {
        proxy_pass http://127.0.0.1:3085/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # /api/... → Nest (PM2 API_PORT)
    location /api/ {
        proxy_pass http://127.0.0.1:3085/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Front React (PM2 HTTP_PORT)
    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
